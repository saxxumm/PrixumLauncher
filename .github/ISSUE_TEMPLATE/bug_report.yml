name: Сообщить об ошибке
description: Что-то работает не так, как должно
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаешь об ошибке! Перед отправкой загляни в [список issues](https://github.com/saxxumm/PrixumLauncher/issues?q=is%3Aissue) — возможно, о ней уже написали.
  - type: dropdown
    id: os
    attributes:
      label: Система
      options:
        - Windows
        - macOS
        - Linux
        - Другая
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Prixum Launcher
      description: Видна под названием лаунчера в левом верхнем углу.
      placeholder: "12.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Что случилось
      description: Опиши проблему и что должно было произойти.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: |
        1. Открыть …
        2. Нажать …
        3. Появляется …
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: Журнал экземпляра (кнопка «Поделиться» даёт ссылку) или лог лаунчера. Проверь, что в нём нет токенов и паролей.
      render: text
