name: Предложить идею
description: Новая функция или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Что добавить или изменить
      description: Опиши идею. Скриншоты и наброски приветствуются.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем это нужно
      description: Какую задачу это решит.
